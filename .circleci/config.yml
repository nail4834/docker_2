version: 2.1

orbs:
  python: circleci/python@2

jobs:
  test-python:
    docker:
      - image: cimg/python:3.8-node
    steps:
      - checkout
      - python/install-packages
      - run:
          name: Run tests
          command: |
            set -o pipefail
            pytest --junitxml=junit.xml
            code=$?
            if [ $code -eq 5 ]; then
              echo "No tests were found."
              touch junit.xml  # create empty file to avoid error
              exit 0
            elif [ $code -ne 0 ]; then
              echo "Tests failed with exit code $code."
              exit $code
            fi
      - store_test_results:
          path: junit.xml

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Deploy
          command: |
            echo "Deploy step goes here"
            # ./deploy.sh

workflows:
  build-and-test:
    jobs:
      - test-python
      - deploy:
          requires:
            - test-python
